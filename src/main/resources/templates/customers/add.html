<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Thêm Khách hàng mới</title>
    <th:block layout:fragment="page_css">
        <link rel="stylesheet" th:href="@{/css/customer.css}" />
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <h4 class="fw-bold py-3 mb-4">
        <span class="text-muted fw-light">Quản lý Khách hàng /</span> Thêm mới
    </h4>
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Thông tin khách hàng mới</h5>
                    <a th:href="@{/customers}" class="btn btn-sm btn-outline-secondary"><i class='bx bx-arrow-back'></i> Quay lại</a>
                </div>
                <div class="card-body">
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong th:text="${errorMessage}">Lỗi!</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <div th:if="${#fields.hasErrors('customer.*')}" class="alert alert-warning" role="alert">
                        Vui lòng kiểm tra lại thông tin:
                        <ul> <li th:each="err : ${#fields.errors('customer.*')}" th:text="${err}" /> </ul>
                    </div>

                    <form th:action="@{/customers/add}" th:object="${customer}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="customerName">Tên khách hàng</label>
                            <input type="text" class="form-control" id="customerName" placeholder="Nhập tên" th:field="*{customerName}" required="required" />
                            <small class="text-danger" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="customerPhone">Số điện thoại</label>
                            <input type="tel" class="form-control" id="customerPhone" placeholder="Nhập SĐT (10 số)"
                                   th:field="*{customerPhone}" required="required"
                                   pattern="[0-9]{10}" maxlength="10" title="Số điện thoại phải có đúng 10 chữ số." />
                            <small class="text-danger" th:if="${#fields.hasErrors('customerPhone')}" th:errors="*{customerPhone}"></small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="customerEmail">Email</label>
                            <input type="email" class="form-control" id="customerEmail" placeholder="Nhập email (vd: abc@example.com)"
                                   th:field="*{customerEmail}" required="required"/>
                            <small class="text-danger" th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}"></small>
                        </div>

                        <input type="hidden" th:field="*{rewardPoints}" value="0" />
                        <input type="hidden" th:field="*{cardType}" value="BROWN" />
                        <input type="hidden" th:field="*{status}" value="ABLE" />

                        <button type="submit" class="btn btn-primary">Thêm khách hàng</button>
                        <a th:href="@{/customers}" class="btn btn-outline-secondary">Hủy</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="page_scripts"> </th:block>
</body>
</html>

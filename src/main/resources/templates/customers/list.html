<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Quản lý Khách hàng</title>
    <th:block layout:fragment="page_css">
        <link rel="stylesheet" th:href="@{/css/customer.css}" />
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Quản lý /</span> Khách hàng</h4>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert"> <strong th:text="${successMessage}"></strong> <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button> </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert"> <strong th:text="${errorMessage}"></strong> <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button> </div>

    <div class="card">
        <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-3">
            <h5 class="mb-0">Danh sách Khách hàng</h5>
            <div class="d-flex flex-wrap gap-3 align-items-center">
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="searchDropdown" data-bs-toggle="dropdown" aria-expanded="false"> Tìm kiếm theo... </button>
                    <ul class="dropdown-menu" aria-labelledby="searchDropdown">
                        <li><a class="dropdown-item search-type-select" href="#search-name-form" data-target-form="search-name-form">Tên</a></li>
                        <li><a class="dropdown-item search-type-select" href="#search-email-form" data-target-form="search-email-form">Email</a></li>
                        <li><a class="dropdown-item search-type-select" href="#search-cardType-form" data-target-form="search-cardType-form">Loại thẻ</a></li>
                    </ul>
                </div>
                <form th:action="@{/customers/search/name}" method="GET" class="d-flex gap-2 search-form" id="search-name-form" style="display: none;"> <input type="hidden" name="page" value="0"/> <input type="text" name="name" class="form-control form-control-sm" placeholder="Nhập tên..." th:value="${#strings.equals(searchType, 'name') ? keyword : ''}" required="required"/> <button type="submit" class="btn btn-sm btn-info"><i class='bx bx-search'></i></button> </form>
                <form th:action="@{/customers/search/email}" method="GET" class="d-flex gap-2 search-form" id="search-email-form" style="display: none;"> <input type="hidden" name="page" value="0"/> <input type="email" name="email" class="form-control form-control-sm" placeholder="Nhập email..." th:value="${#strings.equals(searchType, 'email') ? keyword : ''}" required="required"/> <button type="submit" class="btn btn-sm btn-info"><i class='bx bx-search'></i></button> </form>
                <form th:action="@{/customers/search/cardType}" method="GET" class="d-flex gap-2 search-form" id="search-cardType-form" style="display: none;"> <input type="hidden" name="page" value="0"/> <select name="cardType" class="form-select form-select-sm" required="required"> <option value="">-- Chọn thẻ --</option> <option th:each="type : ${T(com.example.managebyclesystem.constants.CustomerCardType).values()}" th:value="${type}" th:text="${type}" th:selected="${#strings.equals(searchType, 'cardType') and #strings.equals(type.name(), keyword)}"></option> </select> <button type="submit" class="btn btn-sm btn-info"><i class='bx bx-search'></i></button> </form>
                <a th:href="@{/customers}" class="btn btn-sm btn-outline-secondary" th:if="${keyword}"> <i class='bx bx-x'></i> Xóa tìm </a>
                <a th:href="@{/customers/add}" class="btn btn-primary btn-sm"> <i class='bx bx-plus'></i> &nbsp; Thêm khách hàng </a>
            </div>
        </div>
        <div class="table-responsive text-nowrap">
            <table class="table table-hover table-striped">
                <thead>
                <tr>
                    <th>
                        <a th:href="@{/customers/nameAsc(page=${currentPage}, keyword=${keyword}, searchType=${searchType})}" title="Sắp xếp A-Z"><i class='bx bx-sort-a-z'></i></a>
                        Khách hàng
                        <a th:href="@{/customers/nameDesc(page=${currentPage}, keyword=${keyword}, searchType=${searchType})}" title="Sắp xếp Z-A"><i class='bx bx-sort-z-a'></i></a>
                    </th>
                    <th>Số điện thoại</th>
                    <th>Email</th>
                    <th>Loại thẻ</th>
                    <th>
                        <a th:href="@{/customers/pointAsc(page=${currentPage}, keyword=${keyword}, searchType=${searchType})}" title="Sắp xếp điểm tăng dần"><i class='bx bx-sort-up'></i></a>
                        Điểm thưởng
                        <a th:href="@{/customers/pointDesc(page=${currentPage}, keyword=${keyword}, searchType=${searchType})}" title="Sắp xếp điểm giảm dần"><i class='bx bx-sort-down'></i></a>
                    </th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody id="customer-table-body" class="table-border-bottom-0">
                <tr th:if="${#lists.isEmpty(customers)}">
                    <td colspan="7">
                        <div class="empty-state"> <i class='bx bx-user-x'></i> <p th:text="${keyword != null ? 'Không tìm thấy khách hàng phù hợp.' : 'Chưa có khách hàng nào.'}"></p> <a th:if="${keyword == null}" th:href="@{/customers/add}" class="btn btn-sm btn-primary"> Thêm khách hàng đầu tiên </a> </div>
                    </td>
                </tr>
                <tr th:each="customer : ${customers}">
                    <td>
                        <div class="customer-info-cell">
                            <div class="customer-details">
                                <span class="customer-name" th:text="${customer.customerName}"></span>
                            </div>
                        </div>
                    </td>
                    <td th:text="${customer.customerPhone} ?: '-'"></td>
                    <td th:text="${customer.customerEmail} ?: '-'"></td>
                    <td> <span th:if="${customer.cardType != null}" th:text="${#strings.capitalize(#strings.toLowerCase(customer.cardType.name()))}" th:classappend="${#strings.equals(customer.cardType.name(), 'GOLD') ? 'bg-label-warning' : #strings.equals(customer.cardType.name(), 'DIAMOND') ? 'bg-label-info' : #strings.equals(customer.cardType.name(), 'SILVER') ? 'bg-label-primary' : 'bg-label-secondary'}" class="badge"></span> <span th:unless="${customer.cardType != null}">-</span> </td>
                    <td> <i class="bx bx-star text-warning me-1"></i> <span th:text="${customer.rewardPoints} ?: 0"></span> </td>
                    <td> <span th:if="${customer.status != null}" th:text="${#strings.equals(customer.status.name(), 'ABLE') ? 'Hoạt động' : 'Bị khoá'}" th:classappend="${#strings.equals(customer.status.name(), 'ABLE') ? 'bg-label-success' : 'bg-label-danger'}" class="badge"></span> <span th:unless="${customer.status != null}" class="badge bg-label-secondary">Không rõ</span> </td>
                    <td>
                        <div class="table-actions">
                            <a th:href="@{/customers/edit/{id}(id=${customer.customerId})}" class="btn btn-sm btn-icon btn-outline-primary" data-bs-toggle="tooltip" title="Sửa"> <i class="bx bx-edit-alt"></i> </a>
                            <a th:href="@{/customers/delete/{id}(id=${customer.customerId})}" class="btn btn-sm btn-icon btn-outline-danger btn-delete" th:data-customer-name="${customer.customerName}" data-bs-toggle="tooltip" title="Xóa" onclick="return confirm('Bạn có chắc chắn muốn xóa khách hàng \'' + this.getAttribute('data-customer-name') + '\'? Hành động này sẽ vô hiệu hóa khách hàng.');"> <i class="bx bx-trash"></i> </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-4" aria-label="Page navigation" th:if="${totalPages != null and totalPages > 1}">
        <ul id="pagination" class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                <a class="page-link" th:href="
                    ${keyword != null ?
                        #strings.replace(#strings.toLowerCase(searchType), 'type', 'Type') == 'cardType' ?
                             '@{|/customers/search/cardType|(page=${currentPage - 1}, cardType=${keyword})}' :
                             #strings.toLowerCase(searchType) == 'email' ?
                             '@{|/customers/search/email|(page=${currentPage - 1}, email=${keyword})}' :
                             '@{|/customers/search/name|(page=${currentPage - 1}, name=${keyword})}'
                        : sortField != null ?
                             sortField == 'rewardPoints' ?
                             (sortDir == 'asc' ? '@{/customers/pointAsc(page=${currentPage - 1})}' : '@{/customers/pointDesc(page=${currentPage - 1})}') :
                             (sortDir == 'asc' ? '@{/customers/nameAsc(page=${currentPage - 1})}' : '@{/customers/nameDesc(page=${currentPage - 1})}')
                        : '@{/customers(page=${currentPage - 1})}'
                    }">&laquo;</a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage ? 'active' : ''}">
                <a class="page-link" th:href="
                    ${keyword != null ?
                        #strings.replace(#strings.toLowerCase(searchType), 'type', 'Type') == 'cardType' ?
                             '@{|/customers/search/cardType|(page=${i}, cardType=${keyword})}' :
                             #strings.toLowerCase(searchType) == 'email' ?
                             '@{|/customers/search/email|(page=${i}, email=${keyword})}' :
                             '@{|/customers/search/name|(page=${i}, name=${keyword})}'
                        : sortField != null ?
                             sortField == 'rewardPoints' ?
                             (sortDir == 'asc' ? '@{/customers/pointAsc(page=${i})}' : '@{/customers/pointDesc(page=${i})}') :
                             (sortDir == 'asc' ? '@{/customers/nameAsc(page=${i})}' : '@{/customers/nameDesc(page=${i})}')
                        : '@{/customers(page=${i})}'
                    }" th:text="${i + 1}"></a>
            </li>

            <li class="page-item" th:classappend="${currentPage == (totalPages - 1) ? 'disabled' : ''}">
                <a class="page-link" th:href="
                     ${keyword != null ?
                        #strings.replace(#strings.toLowerCase(searchType), 'type', 'Type') == 'cardType' ?
                             '@{|/customers/search/cardType|(page=${currentPage + 1}, cardType=${keyword})}' :
                             #strings.toLowerCase(searchType) == 'email' ?
                             '@{|/customers/search/email|(page=${currentPage + 1}, email=${keyword})}' :
                             '@{|/customers/search/name|(page=${currentPage + 1}, name=${keyword})}'
                        : sortField != null ?
                             sortField == 'rewardPoints' ?
                             (sortDir == 'asc' ? '@{/customers/pointAsc(page=${currentPage + 1})}' : '@{/customers/pointDesc(page=${currentPage + 1})}') :
                             (sortDir == 'asc' ? '@{/customers/nameAsc(page=${currentPage + 1})}' : '@{/customers/nameDesc(page=${currentPage + 1})}')
                        : '@{/customers(page=${currentPage + 1})}'
                    }">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>

<th:block layout:fragment="page_scripts">
    <script>
        $(document).ready(function() {
            const currentSearchType = /*[[${searchType}]]*/ null;
            let initialFormId = 'search-name-form';
            let initialDropdownText = 'Tìm theo Tên';

            if (currentSearchType === 'email') {
                initialFormId = 'search-email-form';
                initialDropdownText = 'Tìm theo Email';
            } else if (currentSearchType === 'cardType') { // Check without case conversion if needed
                initialFormId = 'search-cardType-form';
                initialDropdownText = 'Tìm theo Loại thẻ';
            } else if (currentSearchType === 'name') {
                initialDropdownText = 'Tìm theo Tên';
            }

            // Show the correct form on page load if a search is active
            if (currentSearchType) {
                $('#' + initialFormId).show();
                $('#searchDropdown').text(initialDropdownText);
            } else {
                // Show name form by default if no search is active
                // $('#search-name-form').show(); // Hide by default, let user choose
                $('#searchDropdown').text('Tìm kiếm theo...');
            }

            $('.search-type-select').on('click', function(e) {
                e.preventDefault();
                const targetFormId = $(this).data('target-form');
                $('.search-form').hide();
                $('#' + targetFormId).show();
                $('#searchDropdown').text('Tìm theo ' + $(this).text());
            });
        });
    </script>
</th:block>
</body>
</html>

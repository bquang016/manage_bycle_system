<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Thêm Thanh toán mới</title>
    <th:block layout:fragment="page_css">
        <link rel="stylesheet" th:href="@{/css/payment_add_edit.css}" /> </th:block>
</head>
<body>
<div layout:fragment="content">
    <h4 class="fw-bold py-3 mb-4"> <span class="text-muted fw-light">Quản lý Thanh toán /</span> Thêm mới </h4>
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Thông tin thanh toán mới</h5>
                    <a th:href="@{/payments}" class="btn btn-sm btn-outline-secondary"><i class='bx bx-arrow-back'></i> Quay lại</a>
                </div>
                <div class="card-body">
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert"> <strong th:text="${errorMessage}">Lỗi!</strong> <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button> </div>
                    <div th:if="${#fields.hasErrors('payment.*')}" class="alert alert-warning" role="alert"> Vui lòng kiểm tra lại thông tin: <ul> <li th:each="err : ${#fields.errors('payment.*')}" th:text="${err}" /> </ul> </div>

                    <form th:action="@{/payments/add}" th:object="${payment}" method="post">
                        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" th:if="${_csrf}" />

                        <div class="mb-3">
                            <label class="form-label" for="rentalOrderId">Đơn thuê</label>
                            <select class="form-select" id="rentalOrderId" name="rentalOrderId" required="required">
                                <option value="">-- Chọn đơn thuê --</option>
                                <option th:each="order : ${rentalOrders}"
                                        th:value="${order.rentalOrderId}"
                                        th:text="'#' + ${order.rentalOrderId} + ' - KH: ' + ${order.customerId?.customerName ?: 'N/A'} + ' - Xe: ' + ${order.bikeId?.bikeName ?: 'N/A'}"
                                        th:selected="${payment.rentalOrder != null and order.rentalOrderId == payment.rentalOrder.rentalOrderId}">
                                </option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="paymentMethod">Phương thức</label>
                                <select class="form-select" id="paymentMethod" th:field="*{paymentMethod}" required="required">
                                    <option value="">-- Chọn phương thức --</option>
                                    <option th:each="method : ${T(com.example.managebyclesystem.model.Payment.PaymentMethod).values()}"
                                            th:value="${method}"
                                            th:text="${method.name() == 'CASH' ? 'Tiền mặt' : 'Chuyển khoản'}"></option>
                                </select>
                                <small class="text-danger" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="paymentAmount">Số tiền (VND)</label>
                                <input type="number" class="form-control" id="paymentAmount" placeholder="Nhập số tiền" th:field="*{paymentAmount}" required="required" min="0" step="1000" />
                                <small class="text-danger" th:if="${#fields.hasErrors('paymentAmount')}" th:errors="*{paymentAmount}"></small>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Thêm thanh toán</button>
                        <a th:href="@{/payments}" class="btn btn-outline-secondary">Hủy</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="page_scripts">
</th:block>
</body>
</html>

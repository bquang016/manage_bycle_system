<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">

<head>
    <title>Dashboard</title>
</head>

<body>
<div layout:fragment="content">
    <h4 class="fw-bold py-3 mb-4">Dashboard</h4>

    <div class="row">
        <div class="col-lg-3 col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div class="card-title d-flex flex-column align-items-start">
                            <span class="fw-semibold d-block mb-1">Tổng Doanh Thu</span>
                            <h3 class="card-title mb-2">15.680.000₫</h3>
                            <small class="text-success fw-semibold"><i class="bx bx-up-arrow-alt"></i> +12.5%</small>
                        </div>
                        <div class="avatar flex-shrink-0">
                            <span class="avatar-initial rounded bg-label-primary"><i class="bx bx-dollar-circle fs-3"></i></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div class="card-title d-flex flex-column align-items-start">
                            <span class="fw-semibold d-block mb-1">Đơn Thuê Mới</span>
                            <h3 class="card-title mb-2">82</h3>
                            <small class="text-success fw-semibold"><i class="bx bx-up-arrow-alt"></i> +5.2%</small>
                        </div>
                        <div class="avatar flex-shrink-0">
                            <span class="avatar-initial rounded bg-label-info"><i class="bx bx-receipt fs-3"></i></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <p>Đây là trang Dashboard cơ bản.</p>
    <p>Chỉ người dùng có vai trò ADMIN mới thấy được trang này.</p>

</div>

</body>
</html>

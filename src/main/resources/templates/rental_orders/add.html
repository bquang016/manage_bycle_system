<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head>
    <title>Thêm Đơn thuê mới</title>
    <th:block layout:fragment="page_css">
    </th:block>
</head>
<body>
<div layout:fragment="content">
    <h4 class="fw-bold py-3 mb-4">
        <span class="text-muted fw-light">Quản lý Đơn thuê /</span> Thêm mới
    </h4>
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Thông tin đơn thuê mới</h5>
                    <a th:href="@{/rental-orders}" class="btn btn-sm btn-outline-secondary"><i class='bx bx-arrow-back'></i> Quay lại</a>
                </div>
                <div class="card-body">
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert"> <strong th:text="${errorMessage}">Lỗi!</strong> <button type="button" class="btn-close" data-bs-dismiss="alert"></button> </div>
                    <div th:if="${#fields.hasErrors('rentalOrder.*')}" class="alert alert-warning" role="alert"> Vui lòng kiểm tra lại thông tin: <ul> <li th:each="err : ${#fields.errors('rentalOrder.*')}" th:text="${err}" /> </ul> </div>

                    <form th:action="@{/rental-orders/add}" th:object="${rentalOrder}" method="post">
                        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" th:if="${_csrf}" />

                        <div class="mb-3">
                            <label class="form-label" for="customerId">Khách hàng</label>
                            <select class="form-select" id="customerId" name="customerId" required="required">
                                <option value="">-- Chọn Khách hàng --</option>
                                <option th:each="customer : ${customers}"
                                        th:value="${customer.customerId}"
                                        th:text="${customer.customerName + ' (' + customer.customerPhone + ')'}"
                                        th:selected="${rentalOrder.customerId != null and customer.customerId == rentalOrder.customerId.customerId}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="bikeId">Xe đạp</label>
                            <select class="form-select" id="bikeId" name="bikeId" required="required">
                                <option value="">-- Chọn Xe --</option>
                                <option th:each="bike : ${bikes}"
                                        th:value="${bike.bikeId}"
                                        th:text="${bike.bikeName + ' (' + #numbers.formatCurrency(bike.bikeRentPerHour) + '/giờ)'}"
                                        th:selected="${rentalOrder.bikeId != null and bike.bikeId == rentalOrder.bikeId.bikeId}">
                                </option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="rentalOrderRentalDate">Ngày thuê</label>
                                <input type="date" class="form-control" id="rentalOrderRentalDate" th:field="*{rentalOrderRentalDate}" required="required" />
                                <small class="text-danger" th:if="${#fields.hasErrors('rentalOrderRentalDate')}" th:errors="*{rentalOrderRentalDate}"></small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="rentalOrderRentalTime">Giờ thuê</label>
                                <input type="time" class="form-control" id="rentalOrderRentalTime" th:field="*{rentalOrderRentalTime}" step="1" required="required" />
                                <small class="text-danger" th:if="${#fields.hasErrors('rentalOrderRentalTime')}" th:errors="*{rentalOrderRentalTime}"></small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="promotionId">Khuyến mãi (nếu có)</label>
                            <select class="form-select" id="promotionId" name="promotionId">
                                <option value="">-- Không áp dụng --</option>
                                <option th:each="promo : ${promotions}"
                                        th:value="${promo.promotionId}"
                                        th:text="${promo.promotionName + ' (' + (promo.promotionType.name() == 'PERCENTAGE' ? promo.promotionDiscount + '%' : #numbers.formatCurrency(promo.promotionDiscount)) + ')'}"
                                        th:selected="${rentalOrder.promotionId != null and promo.promotionId == rentalOrder.promotionId.promotionId}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="rentalOrderTotalAmount">Tổng tiền dự kiến (VND)</label>
                            <input type="number" class="form-control" id="rentalOrderTotalAmount" th:field="*{rentalOrderTotalAmount}" required="required" min="0" step="1000" readonly />
                            <small class="text-danger" th:if="${#fields.hasErrors('rentalOrderTotalAmount')}" th:errors="*{rentalOrderTotalAmount}"></small>
                        </div>

                        <button type="submit" class="btn btn-primary">Thêm đơn thuê</button>
                        <a th:href="@{/rental-orders}" class="btn btn-outline-secondary">Hủy</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="page_scripts">
    <script th:inline="javascript">
        $(document).ready(function() {
            const bikeSelect = $('#bikeId');
            const promotionSelect = $('#promotionId');
            const totalAmountInput = $('#rentalOrderTotalAmount');
            const bikesData = /*[[${bikes}]]*/ [];
            const promotionsData = /*[[${promotions}]]*/ [];

            function calculateTotal() {
                const selectedBikeId = bikeSelect.val();
                const selectedPromoId = promotionSelect.val();
                let bikePrice = 0;
                let finalAmount = 0;

                if (selectedBikeId) {
                    const selectedBike = bikesData.find(b => b.bikeId == selectedBikeId);
                    if (selectedBike) { bikePrice = selectedBike.bikeRentPerHour; }
                }
                finalAmount = bikePrice;

                if (selectedPromoId && bikePrice > 0) {
                    const selectedPromo = promotionsData.find(p => p.promotionId == selectedPromoId);
                    if (selectedPromo) {
                        if (selectedPromo.promotionType == 'PERCENTAGE') { finalAmount = bikePrice - (bikePrice * selectedPromo.promotionDiscount / 100); }
                        else if (selectedPromo.promotionType == 'FIXED_AMOUNT') { finalAmount = bikePrice - selectedPromo.promotionDiscount; }
                        if (finalAmount < 0) finalAmount = 0;
                    }
                }
                totalAmountInput.val(Math.round(finalAmount));
            }

            bikeSelect.on('change', calculateTotal);
            promotionSelect.on('change', calculateTotal);
            calculateTotal(); // Initial calculation
        });
    </script>
</th:block>
</body>
</html>
